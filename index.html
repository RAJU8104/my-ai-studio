<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY AI STUDIO</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#070d20;
  color:white;
  min-height:100vh;
  padding:20px;
}

.container{
  width:100%;
  max-width:800px;
  margin:auto;
}

.header{
  text-align:center;
  margin-bottom:25px;
}

.logo{
  font-size:42px;
}

h1{
  font-size:30px;
  margin:8px 0;
}

.subtitle{
  color:#9ca8c7;
}

.card{
  background:#111a35;
  border:1px solid #263354;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
}

h2{
  font-size:20px;
  margin-bottom:15px;
}

.modes{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.mode{
  background:#1a2547;
  border:1px solid #303d65;
  color:white;
  padding:15px 8px;
  border-radius:12px;
  cursor:pointer;
  text-align:center;
}

.mode.active{
  background:#405d9d;
  border-color:#6d8fe8;
}

label{
  display:block;
  margin:15px 0 7px;
  font-weight:bold;
}

textarea,
select{
  width:100%;
  background:#080f25;
  color:white;
  border:1px solid #344263;
  border-radius:12px;
  padding:13px;
  font-size:15px;
}

textarea{
  min-height:130px;
  resize:vertical;
}

.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.upload{
  border:1px dashed #52658f;
  padding:20px;
  border-radius:12px;
  text-align:center;
  margin-top:15px;
}

.generate{
  width:100%;
  margin-top:20px;
  padding:16px;
  border:none;
  border-radius:12px;
  background:#536fe5;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.generate:active{
  transform:scale(.98);
}

#result{
  min-height:200px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#8793b2;
}

#result img,
#result video{
  max-width:100%;
  border-radius:12px;
}

.loading{
  color:#8fa5ff;
}

.footer{
  text-align:center;
  color:#65708c;
  font-size:13px;
  margin-top:25px;
}

@media(max-width:600px){

  body{
    padding:12px;
  }

  .modes{
    grid-template-columns:1fr;
  }

  .options{
    grid-template-columns:1fr;
  }

  h1{
    font-size:25px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">🤖</div>
    <h1>MY AI STUDIO</h1>
    <div class="subtitle">
      Create images and videos with AI
    </div>
  </div>

  <div class="card">

    <h2>Choose Generation</h2>

    <div class="modes">

      <button class="mode active"
              onclick="setMode('image',this)">
        🖼️<br>
        Text → Image
      </button>

      <button class="mode"
              onclick="setMode('video',this)">
        🎬<br>
        Text → Video
      </button>

      <button class="mode"
              onclick="setMode('imagevideo',this)">
        🖼️ → 🎬<br>
        Image → Video
      </button>

    </div>

    <label>Prompt</label>

    <textarea
      id="prompt"
      placeholder="Describe what you want to create..."></textarea>

    <div id="uploadBox" class="upload" style="display:none">

      📁 Upload Image

      <br><br>

      <input
        type="file"
        id="imageInput"
        accept="image/*">

    </div>

    <div class="options">

      <div>

        <label>Resolution</label>

        <select id="resolution">

          <option value="512">512 × 512</option>

          <option value="768">768 × 768</option>

          <option value="1024" selected>
            1024 × 1024
          </option>

          <option value="1280">
            1280 × 1280
          </option>

        </select>

      </div>

      <div>

        <label>Aspect Ratio</label>

        <select id="ratio">

          <option value="1:1">
            1:1 — Square
          </option>

          <option value="16:9">
            16:9 — Landscape
          </option>

          <option value="9:16">
            9:16 — Portrait
          </option>

          <option value="4:3">
            4:3
          </option>

          <option value="3:4">
            3:4
          </option>

        </select>

      </div>

    </div>

    <div id="videoOptions" style="display:none">

      <label>Video Duration</label>

      <select id="duration">

        <option value="5">5 seconds</option>

        <option value="10">
          10 seconds
        </option>

      </select>

    </div>

    <button
      class="generate"
      onclick="generate()">

      ✨ GENERATE

    </button>

  </div>


  <div class="card">

    <h2>Result</h2>

    <div id="result">

      Your generated image or video will appear here.

    </div>

  </div>


  <div class="footer">

    MY AI Studio • Personal AI Generator

  </div>

</div>


<script>

let currentMode = "image";


function setMode(mode,button){

  currentMode = mode;

  document
    .querySelectorAll(".mode")
    .forEach(x => x.classList.remove("active"));

  button.classList.add("active");


  const upload =
    document.getElementById("uploadBox");

  const video =
    document.getElementById("videoOptions");


  if(mode === "image"){

    upload.style.display = "none";

    video.style.display = "none";

  }


  if(mode === "video"){

    upload.style.display = "none";

    video.style.display = "block";

  }


  if(mode === "imagevideo"){

    upload.style.display = "block";

    video.style.display = "block";

  }

}


function generate(){

  const prompt =
    document.getElementById("prompt").value.trim();

  const result =
    document.getElementById("result");


  if(!prompt && currentMode !== "imagevideo"){

    alert("Please enter a prompt.");

    return;

  }


  result.innerHTML =
    '<div class="loading">⏳ AI generation will be connected in the next step...</div>';

}

</script>

</body>
</html>
